[project]
name = "llm-utils-mcp"
version = "0.1.0"
description = "MCP server implementation with FastMCP and LangChain integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llm-utils-core",
    "langchain-core==0.3.78",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
]

[tool.uv.sources]
llm-utils-core = { workspace = true }

[project.optional-dependencies]
# FastMCP integration
fastmcp = [
    "fastmcp>=0.1.0",
]
# LangChain MCP integration
langchain = [
    "langchain==0.3.27",
    "langchain-mcp-adapters==0.1.11",
]
# MCPO OpenAPI integration  
mcpo = [
    "mcpo>=0.0.17",
]
# Full integration with all exporters
full = [
    "fastmcp>=0.1.0",
    "langchain==0.3.27",
    "langchain-mcp-adapters==0.1.11",
    "mcpo>=0.0.17",
]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points."llm_utils.plugins"]
mcp_server = "llm_utils_mcp:MCPServerPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_mcp"]