[project]
name = "llm-utils-subagent"
version = "0.1.0"
description = "Pluggable subagent factory — create, register, and export subagents as LangChain tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.3.0",
    "langgraph>=0.4.0",
]

[project.optional-dependencies]
all = [
    "langchain-openai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_subagent"]
