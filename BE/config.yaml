neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"
  database: "neo4j"

llm:
  provider: "openai"  # Options: "ollama", "openai"
  model: "gpt-4o-mini"   # e.g., "llama3:8b", "gpt-4o"
  base_url: "http://localhost:11434"
  temperature: 0.7
  api_key: ""          # Leave empty to read from OPENAI_API_KEY env var

embeddings:
  provider: "openai"  # Options: "ollama", "openai"
  model: "text-embedding-3-small"
  base_url: "http://localhost:11434"

server:
  host: "0.0.0.0"
  port: 8000

postgres:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "graph_rag_db"


minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  secure: false
  bucket: "documents"
