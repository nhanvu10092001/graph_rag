[project]
name = "llm-utils-vector"
version = "0.1.0"
description = "Vector store factories and implementations for LLM Utils"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llm-utils-core",
]

[project.optional-dependencies]
# Qdrant vector database support
qdrant = [
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.7.0",
]

# PostgreSQL vector database support
postgres = [
    "psycopg[binary]>=3.0.0",
    "langchain-postgres==0.0.15",
    "sqlalchemy[asyncio]>=1.4.0",
]

# All vector database support
all = [
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.7.0",
    "psycopg[binary]>=3.0.0",
    "langchain-postgres==0.0.15",
    "sqlalchemy[asyncio]>=1.4.0",
]

[tool.uv.sources]
llm-utils-core = { workspace = true }
llm-utils-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_vector"]