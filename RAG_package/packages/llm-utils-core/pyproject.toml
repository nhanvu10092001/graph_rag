[project]
name = "llm-utils-core"
version = "0.1.0"  
description = "Core framework for LLM utilities with plugin architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core dependencies - minimal required
    "langchain-core==0.3.78",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Core with common LLM providers
providers = [
    "langchain==0.3.27",
    "langchain-ollama==0.3.10",
    "langchain-openai==0.3.30",
]

[project.entry-points."llm_utils.plugins"]
# Entry point for plugin discovery system

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_core"]