[project]
name = "llm-utils-parser"
version = "0.1.0"
description = "Document parser and text extraction package for LLM Utils"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llm-utils-core",
    "pymupdf>=1.24.0",
    "pypdfium2>=5.0.0",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
    "requests>=2.0.0",
    "openai>=1.0.0",
]

[tool.uv.sources]
llm-utils-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_parser"]
