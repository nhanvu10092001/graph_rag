graph_name: "prime"
model_name: "Qwen/Qwen3-0.6B"
train_trajectories_dir: "data/experiments/prime/graph_explorer_gemini-3.6-flash-high/train"
val_trajectories_dir: "data/experiments/prime/graph_explorer_gemini-3.6-flash-high/val"
output_dir: "data/finetuning"
train_queries_limit: -1
val_queries_limit: -1
wandb_project: "graph-fine-tuning"
use_qlora: true
rejection_sampling: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  max_length: 4096
  packing: false
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  eval_accumulation_steps: 8
  num_train_epochs: 5
  learning_rate: 0.00005
  warmup_steps: 30
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 50
  save_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  optim: "adamw_torch"
  max_grad_norm: 1.0
  assistant_only_loss: true
