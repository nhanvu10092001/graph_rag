graph_name: "prime"
model_name: "Qwen/Qwen3-4B"
train_trajectories_dir: "data/experiments/prime/graph_explorer_oracle_traj/train"
val_trajectories_dir: "data/experiments/prime/graph_explorer_oracle_traj/val"
output_dir: "data/finetuning"
train_queries_limit: 600
val_queries_limit: 200
wandb_project: "graph-fine-tuning"
use_qlora: false
rejection_sampling: false

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  max_length: 4096
  packing: false
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  eval_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 0.0001
  warmup_steps: 50
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 300
  save_steps: 1500
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  optim: "adamw_torch"
  max_grad_norm: 1.0
  assistant_only_loss: true
