services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: graph_rag_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-graph_rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-graph_rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - graph_rag_net

  minio:
    image: minio/minio:latest
    container_name: graph_rag_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graph_rag_net

  neo4j:
    image: neo4j:5.18-community
    container_name: graph_rag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graph_rag_net

  paddleocr:
    image: vllm/vllm-openai:latest
    container_name: graph_rag_paddleocr
    restart: unless-stopped
    ports:
      - "8083:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - paddle_ocr_cache:/root/.cache/huggingface
    command: >
      --model ${PADDLE_OCR_MODEL:-PaddlePaddle/PaddleOCR-VL-1.5}
      --port 8000
      --trust-remote-code
      --max-model-len 4096
      --gpu-memory-utilization 0.70
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - graph_rag_net

  embedding:
    image: vllm/vllm-openai:latest
    container_name: graph_rag_embedding
    restart: unless-stopped
    ports:
      - "8082:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - embedding_cache:/root/.cache/huggingface
    command: >
      --model ${EMBEDDINGS_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --trust-remote-code
      --gpu-memory-utilization 0.15
      --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - graph_rag_net

  backend:
    build:
      context: .
      dockerfile: BE/Dockerfile
    container_name: graph_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-graph_rag_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PADDLE_OCR_API_URL: http://paddleocr:8000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      EMBEDDINGS_OPENAI_API_BASE: ${EMBEDDINGS_OPENAI_API_BASE:-http://embedding:8000/v1}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      paddleocr:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - graph_rag_net

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: graph_rag_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - graph_rag_net

networks:
  graph_rag_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  minio_data:
  paddle_ocr_cache:
  embedding_cache:
