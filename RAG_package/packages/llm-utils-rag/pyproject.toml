[project]
name = "llm-utils-rag"
version = "0.1.0"
description = "RAG (Retrieval-Augmented Generation) plugin for LLM Utils"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llm-utils-core",
    "llm-utils-llm",
    "llm-utils-vector",
    "llm-utils-reranker",
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-experimental==0.3.4",
    "langchain-text-splitters==0.3.9",
    "langchain-experimental==0.3.4",
    "lark==1.3.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "pypdf>=3.0.0",
    "unstructured==0.18.15",
    "python-pptx==1.0.2",
    "python-docx==1.2.0"
]

[project.optional-dependencies]
# All optional dependencies
all = [
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.7.0",
    "langchain-postgres==0.0.15",
    "psycopg2-binary==2.9.11",
    "unstructured>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "ragas>=0.3.0",
    "datasets>=4.0.0",
]
rag = [
    "langchain-community==0.3.27",
]
evaluation = [
    "ragas>=0.3.0",
    "datasets>=4.0.0",
]
# Document loaders for additional file formats
document-loaders = [
    "unstructured>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]
# Database support (PostgreSQL)
database = [
    "psycopg2-binary==2.9.11",
    "langchain-postgres==0.0.15",
]

[project.entry-points."llm_utils.plugins"]
rag = "llm_utils_rag.plugin:RAGPlugin"

[tool.uv.sources]
llm-utils-core = { workspace = true }
llm-utils-llm = { workspace = true }
llm-utils-vector = { workspace = true }
llm-utils-reranker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_rag"]
