[project]
name = "llm-utils-graph-rag"
version = "0.1.0"
description = "Graph RAG (Retrieval-Augmented Generation) plugin using Neo4j and LangGraph"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llm-utils-core",
    "llm-utils-llm",
    "llm-utils-vector",
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langgraph>=0.2.0",
    "neo4j>=5.15.0",
    "llm-utils-reranker",
    "llm-utils-parser",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.entry-points."llm_utils.plugins"]
graph_rag = "llm_utils_graph_rag.plugins.graph_rag_plugin:GraphRAGPlugin"

[tool.uv.sources]
llm-utils-core = { workspace = true }
llm-utils-llm = { workspace = true }
llm-utils-vector = { workspace = true }
llm-utils-reranker = { workspace = true }
llm-utils-parser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_graph_rag"]
