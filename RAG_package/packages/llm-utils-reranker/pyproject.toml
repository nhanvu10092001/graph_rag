[project]
name = "llm-utils-reranker"
version = "0.1.0"
description = "Document and graph entity reranking package for LLM Utils"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llm-utils-core",
    "langchain-core>=0.3.0",
]

[tool.uv.sources]
llm-utils-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_utils_reranker"]
