[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-library"
version = "0.0.1"
authors = [
  { name="Heligate's AI team", email="vupclt@heligate.com.vn" },
]
description = "A plugin-based tool package for Deep Agent integration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.0",
    "redis>=5.0",
    "pymongo>=4.0",
    "motor>=3.0",
    "boto3>=1.28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.21",
    "black>=22.0",
]

[tool.setuptools.packages.find]
where = ["src"]
